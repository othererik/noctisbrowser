name: CI & Pull Request Gates

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Gate 1: Multi-OS Matrix (Ubuntu Linux, macOS, Windows) — Hygiene, Bundled Binaries, Unit Suite & Portable Packaging
  cross-platform-matrix:
    name: "Matrix Validation (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify zero hardcoded personal or machine-specific paths
        shell: bash
        run: |
          echo "Scanning source, test, and build scripts for hardcoded system paths..."
          if grep -rnE "/Users/|/home/[a-zA-Z0-9_-]+/" src/ test/ scripts/ start.sh package.json; then
            echo "❌ Found hardcoded personal path!"
            exit 1
          fi
          echo "✔ Zero hardcoded personal paths detected."

      - name: Run Cross-Platform Unit, Routing, Privacy & VPN Verification Suite
        run: npm run test:unit

      - name: Build Zero-Admin Portable Bundles
        run: npm run dist:portable

  # Gate 2: Full Electron Headless E2E Browser & Guest Webview Verification
  electron-e2e:
    name: "Electron Headless E2E (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: cross-platform-matrix
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Electron Headless E2E Suite (macOS)
        if: runner.os == 'macOS'
        run: npm run test:e2e

      - name: Run Electron Headless E2E Suite (Ubuntu Linux with Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" npm run test:e2e
